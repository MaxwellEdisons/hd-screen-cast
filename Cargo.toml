[package]
name = "hd-screen-cast"
version = "0.3.0"
edition = "2024"
description = "HD desktop casting with Sunshine and virtual displays for Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
sha2 = "0.10"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com", "Win32_Security"] }

[profile.release]
lto = "thin"
strip = true

